name: Daily Supermarket Price & Catalog Sync

on:
  schedule:
    # Run daily at 02:00 UTC (04:00/05:00 Israel time)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Ingest Supermarket Catalogs & Build 1,000+ Items Matrix
        run: node scripts/fetchSupermarketCatalogs.cjs

      - name: Build Web Application
        run: npm run build

      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          commit-message: "Automated Daily Supermarket Catalog Sync [skip ci]"
